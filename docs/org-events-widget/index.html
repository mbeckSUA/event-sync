<meta charset="UTF-8">
<title>Department Events</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Work+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&display=swap">
<style>
  /* Soka University brand palette (SOK001 Guidelines, 12.6.24) — same
     tokens as campus-happenings-sidebar, kept in sync deliberately so a
     department widget sitting next to the main one on SharePoint doesn't
     look like a different product. */
  :root{
    --paper:#FEFDEB;
    --ink:#001D61;
    --ink-muted:#6B7CA3;
    --ink-faint:#A8B2C9;
    --line:#CCD2DF;
    --line-soft:#E0E4EC;
    --teal:#004B87;
    --teal-tint:#D9E4ED;
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%; height:100%;}
  body{
    margin:0; height:100%; overflow:hidden;
    background:var(--paper); color:var(--ink);
    font-family:'Work Sans',ui-sans-serif,system-ui,sans-serif;
    line-height:1.5;
  }
  ::selection{background:var(--teal-tint); color:var(--ink);}

  .wrap{max-width:840px; margin:0 auto; padding:0 20px; height:100%; display:flex; flex-direction:column;}
  header.masthead{flex-shrink:0; padding:20px 0 4px;}
  h1{
    font-family:'Instrument Serif',Georgia,serif;
    font-weight:600; font-size:clamp(24px,4vw,32px);
    line-height:1.1; letter-spacing:-0.01em; margin:0 0 6px;
  }
  .dek{font-size:14px; color:var(--ink-muted); margin:0 0 12px; max-width:56ch;}

  .scroll-area{
    flex:1 1 auto; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch;
    padding-bottom:24px; scrollbar-width:thin; scrollbar-color:var(--line) transparent;
  }
  .scroll-area::-webkit-scrollbar{width:8px;}
  .scroll-area::-webkit-scrollbar-track{background:transparent;}
  .scroll-area::-webkit-scrollbar-thumb{background:var(--line); border-radius:4px;}

  .day-group{margin-top:22px;}
  .day-heading{
    font-family:'Instrument Serif',Georgia,serif; font-style:italic; font-weight:500;
    font-size:17px; color:var(--ink); margin:0 0 8px; padding-bottom:6px;
    border-bottom:1px solid var(--line-soft);
  }
  .day-heading .count{font-family:'Work Sans',ui-sans-serif,system-ui,sans-serif; font-style:normal; font-size:12px; color:var(--ink-faint); margin-left:8px;}

  .row-wrap{border-bottom:1px solid var(--line-soft);}
  .row-wrap:last-child{border-bottom:none;}
  .row{
    display:grid; grid-template-columns:88px 1fr; gap:14px; padding:12px 4px;
    width:100%; text-align:left; background:transparent; border:0; font:inherit;
    color:inherit; cursor:default;
  }
  .row.clickable{cursor:pointer;}
  .row.clickable:hover .title{text-decoration:underline; text-decoration-color:var(--line);}
  .row:focus-visible{outline:2px solid var(--teal); outline-offset:-2px; border-radius:6px;}

  .time{font-size:12px; font-weight:500; color:var(--ink-muted); padding-top:2px;}
  .time .end{display:block; color:var(--ink-faint);}

  .content{min-width:0;}
  .title-line{display:flex; align-items:baseline; gap:8px; flex-wrap:wrap;}
  .title{font-weight:700; font-size:15.5px; color:var(--ink); margin:0;}
  .chevron{margin-left:auto; color:var(--ink-faint); font-size:12px; transition:transform .2s ease; flex-shrink:0;}
  .row-wrap.expanded .chevron{transform:rotate(180deg);}
  .occ{font-size:11px; color:var(--ink-faint);}
  .meta{font-size:12.5px; color:var(--ink-muted); margin-top:2px;}
  .desc-preview{
    font-size:13px; color:var(--ink-muted); margin-top:5px; max-width:62ch;
    overflow-wrap:anywhere; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .row-wrap.expanded .desc-preview{display:none;}

  .detail{max-height:0; overflow:hidden; transition:max-height .28s ease; padding:0 4px 0 102px;}
  .row-wrap.expanded .detail{max-height:600px; padding-bottom:14px;}
  .detail-inner{border-top:1px dashed var(--line); padding-top:10px; max-width:62ch;}
  .detail-desc{font-size:13.5px; color:var(--ink); line-height:1.6; overflow-wrap:anywhere;}
  .detail-desc a{color:var(--teal);}
  .detail-desc p{margin:0 0 8px;}
  .detail-desc p:last-child{margin-bottom:0;}
  .more-info-label{font-size:11px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; color:var(--ink-faint); margin:12px 0 6px !important;}
  .detail-img{display:block; max-width:100%; max-height:200px; border-radius:8px; margin-top:8px; border:1px solid var(--line);}
  .detail-contact{font-size:12px; color:var(--ink-muted); margin-top:8px;}
  .detail-contact a{color:var(--ink-muted);}
  .detail-empty{font-size:12.5px; color:var(--ink-faint); font-style:italic;}

  .empty-state{font-size:13.5px; color:var(--ink-muted); padding:32px 4px; text-align:center;}

  @media (max-width:420px){
    .wrap{padding:0 14px;}
    .row{grid-template-columns:56px 1fr; gap:8px;}
    .detail{padding-left:64px;}
    .title{font-size:14.5px;}
  }
</style>

<div class="wrap">
  <header class="masthead">
    <h1 id="feedTitle">Events</h1>
    <p class="dek" id="feedDek">A rolling look at upcoming events.</p>
  </header>
  <div class="scroll-area">
    <div id="listView"></div>
  </div>
</div>

<script>
// Which department feed this embed shows is set by a query-string param on
// the iframe src, e.g. index.html?feed=recreation or ?feed=library — one
// page, reused per department, rather than a separate copy per org. Add a
// new department by adding it to FEED_CONFIG here and to FEEDS in
// build_org_events.py; no third place to update.
const FEED_CONFIG = {
  recreation: {file: 'recreation-events.json', title: 'Recreation Events', dek: 'Upcoming Recreation events and activities.', days: 30},
  library:    {file: 'library-events.json',    title: 'Library Events',    dek: 'Upcoming Library events and programs.',     days: 30},
};

const params = new URLSearchParams(location.search);
const feedKey = params.get('feed') || 'recreation';
const cfg = FEED_CONFIG[feedKey] || FEED_CONFIG.recreation;
document.getElementById('feedTitle').textContent = cfg.title;
document.getElementById('feedDek').textContent = cfg.dek;

let EVENTS = [];
let loadFailed = false;

function localDateStr(d){
  d = d || new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function fmtDayHeading(dateStr){
  const [y,m,d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  const full = dt.toLocaleDateString('en-US', {month:'long', day:'numeric'});
  const todayStr = localDateStr();
  const tomorrow = new Date();
  tomorrow.setDate(tomorrow.getDate() + 1);
  let label;
  if(dateStr === todayStr) label = 'Today';
  else if(dateStr === localDateStr(tomorrow)) label = 'Tomorrow';
  else label = dt.toLocaleDateString('en-US', {weekday:'long'});
  return label + ', ' + full;
}

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function linkifyPlain(text){
  const esc = escapeHtml(text);
  return esc.replace(/((https?:\/\/[^\s<]+))/g, url => {
    const clean = url.replace(/[),.]+$/, '');
    const trail = url.slice(clean.length);
    return '<a href="' + clean + '" target="_blank" rel="noopener noreferrer">' + clean + '</a>' + trail;
  }).replace(/\n/g, '<br>');
}

const ALLOWED_TAGS = new Set(['P','A','BR','STRONG','B','EM','I','UL','OL','LI','SPAN']);
function sanitizeRich(html){
  const tmp = document.createElement('div');
  tmp.innerHTML = html;
  (function clean(node){
    [...node.childNodes].forEach(child => {
      if(child.nodeType === 1){
        if(!ALLOWED_TAGS.has(child.tagName)){
          const text = document.createTextNode(child.textContent);
          node.replaceChild(text, child);
          return;
        }
        [...child.attributes].forEach(attr => {
          if(child.tagName === 'A' && attr.name === 'href'){
            if(!/^https?:\/\//i.test(attr.value)) child.removeAttribute('href');
          } else {
            child.removeAttribute(attr.name);
          }
        });
        if(child.tagName === 'A'){
          child.setAttribute('target','_blank');
          child.setAttribute('rel','noopener noreferrer');
        }
        clean(child);
      } else if(child.nodeType !== 3){
        node.removeChild(child);
      }
    });
  })(tmp);
  return tmp.innerHTML;
}

function descriptionHtml(e){
  const desc = e.description || '';
  const ext = e.extendedDescription || '';
  const parts = [];
  if(desc) parts.push(linkifyPlain(desc));
  if(ext){
    const extUrls = [...ext.matchAll(/href="([^"]+)"/g)].map(m => m[1]);
    const alreadyLinked = extUrls.length > 0 && extUrls.every(u => desc.includes(u));
    if(!alreadyLinked){
      const rich = sanitizeRich(ext);
      parts.push(desc ? '<p class="more-info-label">Registration &amp; more info</p>' + rich : rich);
    }
  }
  return parts.join('');
}

function hasDetail(e){
  return !!(e.description || e.extendedDescription || e.imageURL || e.contact || e.org);
}

// Rolling window length is per-feed (cfg.days) rather than hardcoded — a
// department feed may want a longer look-ahead than the main sidebar's 7
// days, since it's the department's own dedicated widget, not a compact
// homepage teaser.
function filteredEvents(){
  const todayStr = localDateStr();
  const end = new Date();
  end.setDate(end.getDate() + (cfg.days || 30));
  const endStr = localDateStr(end);
  const out = [];
  EVENTS.forEach(e => {
    (e.occurrenceDates || [e.date]).forEach(d => {
      if(d >= todayStr && d <= endStr) out.push(Object.assign({}, e, {date: d}));
    });
  });
  return out;
}

function renderList(){
  const list = document.getElementById('listView');
  list.innerHTML = '';

  const events = filteredEvents();
  if(!events.length){
    const empty = document.createElement('p');
    empty.className = 'empty-state';
    empty.textContent = loadFailed
      ? 'Couldn’t load events right now.'
      : 'No upcoming events in the next ' + (cfg.days || 30) + ' days.';
    list.appendChild(empty);
    return;
  }

  const groups = {};
  events.forEach(e => { (groups[e.date] = groups[e.date] || []).push(e); });
  const dates = Object.keys(groups).sort();

  dates.forEach(date => {
    const items = groups[date];
    const dayEl = document.createElement('div');
    dayEl.className = 'day-group';
    const heading = document.createElement('h2');
    heading.className = 'day-heading';
    heading.innerHTML = fmtDayHeading(date) + '<span class="count">' + items.length + ' event' + (items.length===1?'':'s') + '</span>';
    dayEl.appendChild(heading);

    items.forEach(e => {
      const wrap = document.createElement('div');
      wrap.className = 'row-wrap';
      const clickable = hasDetail(e);
      const row = document.createElement('button');
      row.type = 'button';
      row.className = 'row' + (clickable ? ' clickable' : '');
      row.setAttribute('aria-expanded', 'false');
      if(!clickable) row.disabled = true;

      const time = document.createElement('div');
      time.className = 'time';
      if(e.allDay){
        time.textContent = 'All day';
      } else {
        time.innerHTML = escapeHtml(e.startTime || '') + (e.endTime ? '<span class="end">' + escapeHtml(e.endTime) + '</span>' : '');
      }
      row.appendChild(time);

      const content = document.createElement('div');
      content.className = 'content';

      const titleLine = document.createElement('div');
      titleLine.className = 'title-line';
      const title = document.createElement('p');
      title.className = 'title';
      title.textContent = e.name;
      titleLine.appendChild(title);
      if(e.occurrenceCount > 1){
        const occ = document.createElement('span');
        occ.className = 'occ';
        occ.textContent = '×' + e.occurrenceCount;
        titleLine.appendChild(occ);
      }
      if(clickable){
        const chev = document.createElement('span');
        chev.className = 'chevron';
        chev.textContent = '▾';
        chev.setAttribute('aria-hidden','true');
        titleLine.appendChild(chev);
      }
      content.appendChild(titleLine);

      const meta = document.createElement('div');
      meta.className = 'meta';
      const parts = [];
      if(e.room) parts.push(e.room);
      if(e.building && e.building !== e.room) parts.push(e.building);
      meta.textContent = parts.join(' · ') || '—';
      content.appendChild(meta);

      if(e.description){
        const preview = document.createElement('div');
        preview.className = 'desc-preview';
        preview.textContent = e.description;
        content.appendChild(preview);
      }

      row.appendChild(content);
      wrap.appendChild(row);

      if(clickable){
        const detail = document.createElement('div');
        detail.className = 'detail';
        const inner = document.createElement('div');
        inner.className = 'detail-inner';

        const dHtml = descriptionHtml(e);
        if(dHtml){
          const dDesc = document.createElement('div');
          dDesc.className = 'detail-desc';
          dDesc.innerHTML = dHtml;
          inner.appendChild(dDesc);
        } else {
          const empty = document.createElement('div');
          empty.className = 'detail-empty';
          empty.textContent = 'No description on file.';
          inner.appendChild(empty);
        }

        if(e.imageURL){
          const img = document.createElement('img');
          img.className = 'detail-img';
          img.src = e.imageURL;
          img.alt = e.name;
          img.loading = 'lazy';
          inner.appendChild(img);
        }

        if(e.contact){
          const c = document.createElement('div');
          c.className = 'detail-contact';
          const nm = escapeHtml(e.contact.name || '');
          const em = e.contact.email || '';
          c.innerHTML = 'Contact: ' + nm + (em ? ' &middot; <a href="mailto:' + escapeHtml(em) + '">' + escapeHtml(em) + '</a>' : '');
          inner.appendChild(c);
        }

        detail.appendChild(inner);
        wrap.appendChild(detail);

        row.addEventListener('click', () => {
          const isOpen = wrap.classList.toggle('expanded');
          row.setAttribute('aria-expanded', String(isOpen));
        });
      }

      dayEl.appendChild(wrap);
    });

    list.appendChild(dayEl);
  });
}

async function loadEvents(){
  try {
    const resp = await fetch('../' + cfg.file, {cache: 'no-store'});
    if(!resp.ok) throw new Error('HTTP ' + resp.status);
    EVENTS = await resp.json();
    loadFailed = false;
  } catch(err) {
    console.error('Failed to load ' + cfg.file, err);
    loadFailed = true;
  }
  renderList();
}

loadEvents();
setInterval(loadEvents, 15 * 60 * 1000);
</script>
