<meta charset="UTF-8">
<title>Campus Happenings</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Work+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&display=swap">
<style>
  /* Soka University brand palette (SOK001 Guidelines, 12.6.24) */
  :root{
    --paper:#FEFDEB;          /* Pure Light */
    --paper-raised:#FFFFFF;
    --ink:#001D61;            /* Deep Reflection */
    --ink-muted:#6B7CA3;
    --ink-faint:#A8B2C9;
    --line:#CCD2DF;
    --line-soft:#E0E4EC;
    --teal:#004B87;           /* Soka Blue — Campus Events */
    --teal-tint:#D9E4ED;
    --ochre:#B55C00;          /* Golden Saffron — Academic */
    --ochre-tint:#FFECD9;
    --plum:#7E335A;           /* Purposeful Plum — Arts */
    --plum-tint:#ECE0E6;
    --periwinkle:#5D5CE4;     /* Violet Radiance — Student Org */
    --periwinkle-tint:#E7E7FB;
    --accent:#004B87;         /* Soka Blue */
    --accent-ink:#FFFFFF;
    --new-flag:#001D61;       /* Deep Reflection text on Soka Yellow */
    --new-flag-tint:#FCD43B;  /* Soka Yellow */
    --gap-stat:#D63932;       /* Courageous Crimson — standalone "invisible" stat number */
    --clay:#D63932;           /* Courageous Crimson — Facility notice */
    --clay-tint:#FEE3E1;
    --slate:#004851;          /* Forest Path — Academic Calendar */
    --slate-tint:#D9E4E5;
    --shadow: 0 1px 2px rgba(0,29,97,0.07), 0 8px 24px -12px rgba(0,29,97,0.20);
  }
  /* Dark mode intentionally not offered — the page always renders in Soka's
     light brand palette regardless of the viewer's system setting. */

  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%; height:100%;}
  body{
    margin:0;
    height:100%;
    overflow:hidden; /* .scroll-area owns scrolling, not the page/iframe itself */
    background:var(--paper);
    color:var(--ink);
    font-family:'Work Sans',ui-sans-serif,system-ui,sans-serif;
    line-height:1.5;
  }
  ::selection{background:var(--teal-tint); color:var(--ink);}

  /* This page is always embedded at a fixed iframe height (a SharePoint
     sidebar column) — event count swings a lot week to week, so rather than
     the page growing to fit content (and blowing out that fixed height),
     the header stays put and only the list area scrolls internally. Whatever
     height the embedding iframe is given, this fills it exactly. */
  .wrap{
    max-width:840px;
    margin:0 auto;
    padding:0 20px;
    height:100%;
    display:flex;
    flex-direction:column;
  }
  header.masthead{flex-shrink:0;}
  .scroll-area{
    flex:1 1 auto;
    min-height:0; /* required for flex children to actually scroll instead of overflowing */
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    padding-bottom:24px;
    /* Visible on purpose — a hidden scrollbar removes the only cue that there's
       more content below, and removes the click-and-drag navigation option for
       anyone who finds precise wheel/trackpad scrolling harder. Thin and on-brand
       instead of hidden or stock browser gray. */
    scrollbar-width:thin;
    scrollbar-color:var(--line) transparent;
  }
  .scroll-area::-webkit-scrollbar{width:8px;}
  .scroll-area::-webkit-scrollbar-track{background:transparent;}
  .scroll-area::-webkit-scrollbar-thumb{background:var(--line); border-radius:4px;}
  .scroll-area::-webkit-scrollbar-thumb:hover{background:var(--ink-faint);}

  header.masthead{
    padding:56px 0 28px;
    border-bottom:1px solid var(--line);
    margin-bottom:28px;
  }
  h1{
    font-family:'Instrument Serif',Georgia,serif;
    font-weight:600;
    font-size:clamp(34px,5.5vw,52px);
    line-height:1.05;
    letter-spacing:-0.01em;
    margin:0 0 14px;
    text-wrap:balance;
  }
  .dek{
    font-size:16px;
    color:var(--ink-muted);
    max-width:56ch;
    margin:0 0 28px;
  }
  .dek strong{color:var(--ink); font-weight:600;}

  /* ---- List view ---- */
  .day-group{margin-top:30px;}
  .day-heading{
    font-family:'Instrument Serif',Georgia,serif;
    font-style:italic;
    font-weight:500;
    font-size:19px;
    color:var(--ink);
    margin:0 0 10px;
    padding-bottom:6px;
    border-bottom:1px solid var(--line-soft);
    scroll-margin-top:76px;
    transition:background .6s ease;
    border-radius:6px;
  }
  .day-heading.flash{background:var(--teal-tint);}
  .day-heading .count{
    font-family:'Work Sans',ui-sans-serif,system-ui,sans-serif;
    font-style:normal;
    font-size:12px;
    color:var(--ink-faint);
    margin-left:8px;
  }

  .row-wrap{border-bottom:1px solid var(--line-soft);}
  .row-wrap:last-child{border-bottom:none;}
  .row{
    display:grid;
    grid-template-columns:92px 1fr;
    gap:16px;
    padding:14px 4px;
    width:100%;
    text-align:left;
    background:transparent;
    border:0;
    font:inherit;
    color:inherit;
    cursor:default;
    animation:rise .35s ease both;
  }
  .row.clickable{cursor:pointer;}
  .row.clickable:hover .title{text-decoration:underline; text-decoration-color:var(--line);}
  .row:focus-visible{outline:2px solid var(--teal); outline-offset:-2px; border-radius:6px;}
  @media (prefers-reduced-motion: reduce){ .row{animation:none;} }
  @keyframes rise{
    from{opacity:0; transform:translateY(4px);}
    to{opacity:1; transform:translateY(0);}
  }

  .time{
    font-family:'Work Sans',ui-sans-serif,system-ui,sans-serif;
    font-size:12px;
    font-weight:500;
    color:var(--ink-muted);
    padding-top:3px;
    line-height:1.4;
  }
  .time .end{display:block; color:var(--ink-faint);}

  .content{min-width:0;}
  .content .title-line{
    display:flex;
    align-items:baseline;
    gap:9px;
    flex-wrap:wrap;
  }
  .title{
    font-family:'Work Sans',ui-sans-serif,system-ui,sans-serif;
    font-weight:700;
    font-size:16.5px;
    color:var(--ink);
    margin:0;
  }
  .chevron{
    margin-left:auto;
    color:var(--ink-faint);
    font-size:12px;
    transition:transform .2s ease;
    flex-shrink:0;
    align-self:center;
  }
  .row-wrap.expanded .chevron{transform:rotate(180deg);}
  .tag{
    font-family:'Work Sans',ui-sans-serif,system-ui,sans-serif;
    font-size:10.5px;
    font-weight:600;
    letter-spacing:.03em;
    text-transform:uppercase;
    padding:2.5px 7px;
    border-radius:5px;
    white-space:nowrap;
  }
  .tag.t-campus{background:var(--teal-tint); color:var(--teal);}
  .tag.t-academic{background:var(--ochre-tint); color:var(--ochre);}
  .tag.t-arts{background:var(--plum-tint); color:var(--plum);}
  .tag.t-org{background:var(--periwinkle-tint); color:var(--periwinkle);}
  .tag.t-facility{background:var(--clay-tint); color:var(--clay);}
  .tag.t-milestone{background:var(--slate-tint); color:var(--slate);}
  .tag.flag{background:var(--new-flag-tint); color:var(--new-flag);}

  .meta{
    font-size:13px;
    color:var(--ink-muted);
    margin-top:3px;
  }
  .desc-preview{
    font-size:13.5px;
    color:var(--ink-muted);
    margin-top:6px;
    max-width:62ch;
    overflow-wrap:anywhere;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }
  /* Once expanded, the detail panel below shows the full description —
     the clamped teaser above would just repeat the same text. */
  .row-wrap.expanded .desc-preview{display:none;}
  .occ{
    font-family:'Work Sans',ui-sans-serif,system-ui,sans-serif;
    font-size:11px;
    color:var(--ink-faint);
  }

  .detail{
    max-height:0;
    overflow:hidden;
    transition:max-height .28s ease;
    padding:0 4px 0 108px;
  }
  .row-wrap.expanded .detail{max-height:600px; padding-bottom:16px;}
  .detail-inner{
    border-top:1px dashed var(--line);
    padding-top:12px;
    max-width:62ch;
  }
  .detail-desc{
    font-size:14px;
    color:var(--ink);
    line-height:1.6;
    overflow-wrap:anywhere;
  }
  .detail-desc a{color:var(--teal);}
  .detail-desc p{margin:0 0 10px;}
  .detail-desc p:last-child{margin-bottom:0;}
  .more-info-label{
    font-size:11px;
    font-weight:600;
    letter-spacing:.04em;
    text-transform:uppercase;
    color:var(--ink-faint);
    margin:14px 0 6px !important;
  }
  .detail-img{
    display:block;
    max-width:100%;
    max-height:220px;
    border-radius:8px;
    margin-top:10px;
    border:1px solid var(--line);
  }
  .detail-contact{
    font-size:12.5px;
    color:var(--ink-muted);
    margin-top:10px;
  }
  .detail-contact a{color:var(--ink-muted);}
  .detail-empty{font-size:13px; color:var(--ink-faint); font-style:italic;}

  @media (max-width:520px){
    .row{grid-template-columns:64px 1fr; gap:10px;}
    .detail{padding-left:80px;}
    h1{font-size:32px;}
  }

  /* Narrow sidebar / compact embed — e.g. a SharePoint web-part column.
     Same content, far less chrome before the first event shows up. */
  @media (max-width:420px){
    .wrap{padding:0 14px 56px;}
    header.masthead{padding:24px 0 16px; margin-bottom:16px;}
    h1{font-size:26px; margin:0 0 8px;}
    .dek{font-size:13.5px; margin:0 0 16px;}
    .day-group{margin-top:20px;}
    .day-heading{font-size:16px;}
    .row{grid-template-columns:56px 1fr; gap:8px; padding:11px 2px;}
    .detail{padding-left:64px;}
    .title{font-size:15.5px;}
  }

  .empty-state{
    font-size:14px;
    color:var(--ink-muted);
    padding:40px 4px;
    text-align:center;
  }

  footer{
    margin-top:56px;
    padding-top:20px;
    border-top:1px solid var(--line);
    font-size:12.5px;
    color:var(--ink-faint);
    max-width:62ch;
  }
  footer p{margin:0 0 8px;}
  footer code{
    font-family:'Work Sans',ui-sans-serif,system-ui,sans-serif;
    background:var(--line-soft);
    padding:1px 5px;
    border-radius:4px;
    font-size:11px;
  }

  /* Persistent, outside the scroll area on purpose — the widget only shows a
     rolling 7 days, so the way out to everything else should stay visible
     no matter where someone's scrolled to, not live at the bottom of the list. */
  .full-cal-link{
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    padding:14px 4px;
    border-top:1px solid var(--line);
    font-family:'Work Sans',ui-sans-serif,system-ui,sans-serif;
    font-size:13px;
    font-weight:600;
    color:var(--teal);
    text-decoration:none;
  }
  .full-cal-link:hover{text-decoration:underline;}
  .full-cal-link .arrow{transition:transform .15s ease;}
  .full-cal-link:hover .arrow{transform:translateX(3px);}
</style>

<div class="wrap">
  <header class="masthead">
    <h1>Campus Happenings</h1>
    <p class="dek">Everything going on around the Aliso Viejo campus.</p>
  </header>

  <div class="scroll-area">
    <div id="listView"></div>

    <footer>
      <p>Pulled from Coursedog &mdash; click any event for the full description. Multi-day or recurring items show their first date; a <code>&times;N</code> tag means it repeats N times.</p>
    </footer>
  </div>

  <a class="full-cal-link" href="https://sokauniversity.sharepoint.com/sites/MarketingandCommunications/SitePages/Testing(1).aspx">
    See the full calendar
    <span class="arrow" aria-hidden="true">&rarr;</span>
  </a>
</div>

<script>
let EVENTS = [];
let loadFailed = false;

const CATEGORY = {
  'Campus Events': {cls:'t-campus', label:'Campus'},
  'Academic Programs & Events': {cls:'t-academic', label:'Academic'},
  'Academic Affairs Events & Reservations': {cls:'t-academic', label:'Academic'},
  'Academic Events and Reservations (Undergraduate)': {cls:'t-academic', label:'Academic'},
  'Performing Arts Center': {cls:'t-arts', label:'Arts'},
  'Student Organization Event': {cls:'t-org', label:'Student Org'},
  'Academic Calendar': {cls:'t-milestone', label:'Academic Calendar'},
};
const FACILITY_TAG = {cls:'t-facility', label:'Facility notice'};
const CAT_DOT = {
  't-campus':'var(--teal)', 't-academic':'var(--ochre)', 't-arts':'var(--plum)',
  't-org':'var(--periwinkle)', 't-milestone':'var(--slate)', 't-facility':'var(--clay)'
};

function catFor(e){
  return e.facility ? FACILITY_TAG : (CATEGORY[e.type] || {cls:'t-campus', label:e.type});
}

function fmtDayHeading(dateStr){
  const [y,m,d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  return dt.toLocaleDateString('en-US', {weekday:'long', month:'long', day:'numeric'});
}

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// Turn bare URLs in plain text into links, after escaping.
function linkifyPlain(text){
  const esc = escapeHtml(text);
  return esc.replace(/((https?:\/\/[^\s<]+))/g, url => {
    const clean = url.replace(/[),.]+$/, '');
    const trail = url.slice(clean.length);
    return '<a href="' + clean + '" target="_blank" rel="noopener noreferrer">' + clean + '</a>' + trail;
  }).replace(/\n/g, '<br>');
}

// Minimal allow-list sanitizer for Coursedog's rich-text "extendedDescription" field.
const ALLOWED_TAGS = new Set(['P','A','BR','STRONG','B','EM','I','UL','OL','LI','SPAN']);
function sanitizeRich(html){
  const tmp = document.createElement('div');
  tmp.innerHTML = html;
  (function clean(node){
    [...node.childNodes].forEach(child => {
      if(child.nodeType === 1){
        if(!ALLOWED_TAGS.has(child.tagName)){
          const text = document.createTextNode(child.textContent);
          node.replaceChild(text, child);
          return;
        }
        [...child.attributes].forEach(attr => {
          if(child.tagName === 'A' && attr.name === 'href'){
            if(!/^https?:\/\//i.test(attr.value)) child.removeAttribute('href');
          } else {
            child.removeAttribute(attr.name);
          }
        });
        if(child.tagName === 'A'){
          child.setAttribute('target','_blank');
          child.setAttribute('rel','noopener noreferrer');
        }
        clean(child);
      } else if(child.nodeType !== 3){
        node.removeChild(child);
      }
    });
  })(tmp);
  return tmp.innerHTML;
}

function descriptionHtml(e){
  const desc = e.description || '';
  const ext = e.extendedDescription || '';
  const parts = [];
  if(desc) parts.push(linkifyPlain(desc));

  if(ext){
    // Coursedog's extendedDescription is where registration/ticket/RSVP links
    // usually live. Some events already repeat that same URL as plain text in
    // description (which linkifyPlain already turned into a link above) — skip
    // re-showing it there. Otherwise it's the only place the link exists, so
    // surface it explicitly rather than silently dropping it.
    const extUrls = [...ext.matchAll(/href="([^"]+)"/g)].map(m => m[1]);
    const alreadyLinked = extUrls.length > 0 && extUrls.every(u => desc.includes(u));
    if(!alreadyLinked){
      const rich = sanitizeRich(ext);
      parts.push(desc ? '<p class="more-info-label">Registration &amp; more info</p>' + rich : rich);
    }
  }
  return parts.join('');
}

function hasDetail(e){
  return !!(e.description || e.extendedDescription || e.imageURL || e.contact || e.org);
}

// ---------- Upcoming window ----------
// Sidebar variant is deliberately not filterable — it always shows a rolling
// 7-day window (today through +6 days). Recomputed on every render so "today"
// stays live rather than freezing at page-load time.
function filteredEvents(){
  const todayStr = new Date().toISOString().slice(0,10);
  const end = new Date();
  end.setDate(end.getDate() + 6);
  const endStr = end.toISOString().slice(0,10);
  return EVENTS.filter(e => e.date >= todayStr && e.date <= endStr);
}

// ---------- List view ----------
function renderList(){
  const list = document.getElementById('listView');
  list.innerHTML = '';

  const events = filteredEvents();
  if(!events.length){
    const empty = document.createElement('p');
    empty.className = 'empty-state';
    empty.textContent = loadFailed
      ? 'Couldn’t load the calendar right now.'
      : 'No events in the next 7 days.';
    list.appendChild(empty);
    return;
  }

  const groups = {};
  events.forEach(e => { (groups[e.date] = groups[e.date] || []).push(e); });
  const dates = Object.keys(groups).sort();

  dates.forEach(date => {
    const items = groups[date];

    const dayEl = document.createElement('div');
    dayEl.className = 'day-group';
    dayEl.id = 'day-' + date;
    const heading = document.createElement('h2');
    heading.className = 'day-heading';
    heading.innerHTML = fmtDayHeading(date) + '<span class="count">' + items.length + ' event' + (items.length===1?'':'s') + '</span>';
    dayEl.appendChild(heading);

    items.forEach(e => {
      const cat = catFor(e);
      const wrap = document.createElement('div');
      wrap.className = 'row-wrap';

      const clickable = hasDetail(e);
      const row = document.createElement('button');
      row.type = 'button';
      row.className = 'row' + (clickable ? ' clickable' : '');
      row.setAttribute('aria-expanded', 'false');
      if(!clickable) row.disabled = true;

      const time = document.createElement('div');
      time.className = 'time';
      if(e.allDay){
        time.textContent = 'All day';
      } else {
        time.innerHTML = escapeHtml(e.startTime || '') + (e.endTime ? '<span class="end">' + escapeHtml(e.endTime) + '</span>' : '');
      }
      row.appendChild(time);

      const content = document.createElement('div');
      content.className = 'content';

      const titleLine = document.createElement('div');
      titleLine.className = 'title-line';
      const title = document.createElement('p');
      title.className = 'title';
      title.textContent = e.name;
      titleLine.appendChild(title);

      if(cat.cls !== 't-campus' && cat.cls !== 't-academic'){
        const tag = document.createElement('span');
        tag.className = 'tag ' + cat.cls;
        tag.textContent = cat.label;
        titleLine.appendChild(tag);
      }
      if(e.occurrenceCount > 1){
        const occ = document.createElement('span');
        occ.className = 'occ';
        occ.textContent = '×' + e.occurrenceCount;
        titleLine.appendChild(occ);
      }
      if(clickable){
        const chev = document.createElement('span');
        chev.className = 'chevron';
        chev.textContent = '▾';
        chev.setAttribute('aria-hidden','true');
        titleLine.appendChild(chev);
      }
      content.appendChild(titleLine);

      const meta = document.createElement('div');
      meta.className = 'meta';
      const parts = [];
      if(e.room) parts.push(e.room);
      if(e.building && e.building !== e.room) parts.push(e.building);
      meta.textContent = parts.join(' · ') || '—';
      content.appendChild(meta);

      if(e.description){
        const preview = document.createElement('div');
        preview.className = 'desc-preview';
        preview.textContent = e.description;
        content.appendChild(preview);
      }

      row.appendChild(content);
      wrap.appendChild(row);

      if(clickable){
        const detail = document.createElement('div');
        detail.className = 'detail';
        const inner = document.createElement('div');
        inner.className = 'detail-inner';

        const dHtml = descriptionHtml(e);
        if(dHtml){
          const dDesc = document.createElement('div');
          dDesc.className = 'detail-desc';
          dDesc.innerHTML = dHtml;
          inner.appendChild(dDesc);
        } else {
          const empty = document.createElement('div');
          empty.className = 'detail-empty';
          empty.textContent = 'No description on file.';
          inner.appendChild(empty);
        }

        if(e.imageURL){
          const img = document.createElement('img');
          img.className = 'detail-img';
          img.src = e.imageURL;
          img.alt = e.name;
          img.loading = 'lazy';
          inner.appendChild(img);
        }

        if(e.org){
          const org = document.createElement('div');
          org.className = 'detail-contact';
          org.textContent = 'Organizer: ' + e.org;
          inner.appendChild(org);
        }

        if(e.contact){
          const c = document.createElement('div');
          c.className = 'detail-contact';
          const nm = escapeHtml(e.contact.name || '');
          const em = e.contact.email || '';
          c.innerHTML = 'Contact: ' + nm + (em ? ' &middot; <a href="mailto:' + escapeHtml(em) + '">' + escapeHtml(em) + '</a>' : '');
          inner.appendChild(c);
        }

        detail.appendChild(inner);
        wrap.appendChild(detail);

        row.addEventListener('click', () => {
          const isOpen = wrap.classList.toggle('expanded');
          row.setAttribute('aria-expanded', String(isOpen));
        });
      }

      dayEl.appendChild(wrap);
    });

    list.appendChild(dayEl);
  });
}

// ---------- Data loading ----------
// events.json is generated by build_campus_events.py from live Coursedog
// data and lives one level up from this page (docs/events.json). Fetched
// fresh on load and on an interval — not just to roll the 7-day window
// forward on a page left open overnight, but so a long-open SharePoint
// embed picks up newly published events without needing a manual reload.
async function loadEvents(){
  try {
    const resp = await fetch('../events.json', {cache: 'no-store'});
    if(!resp.ok) throw new Error('HTTP ' + resp.status);
    EVENTS = await resp.json();
    loadFailed = false;
  } catch(err) {
    console.error('Failed to load events.json', err);
    loadFailed = true;
    // Keep whatever EVENTS already holds (empty on a first-load failure,
    // last-successful-fetch on a later one) rather than blanking a working
    // display over one bad request.
  }
  renderList();
}

// ---------- Controls ----------
loadEvents();
setInterval(loadEvents, 15 * 60 * 1000);
</script>
