name: Department Events (Recreation, Library)

on:
  schedule:
    - cron: '31 10 * * *'  # ~3:31am Pacific — offset from campus-events.yml (10:22)
                            # and sync.yml (10:07) so all three don't race on the
                            # same checkout, same reasoning as those two.
  workflow_dispatch:        # Manual trigger for testing

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Pull department feeds from Coursedog
        env:
          # Same dedicated read-only user as build_campus_events.py —
          # no new secret needed for this workflow.
          COURSEDOG_READONLY_BASE: ${{ secrets.COURSEDOG_READONLY_BASE }}
          COURSEDOG_READONLY_EMAIL: ${{ secrets.COURSEDOG_READONLY_EMAIL }}
          COURSEDOG_READONLY_PASSWORD: ${{ secrets.COURSEDOG_READONLY_PASSWORD }}
          COURSEDOG_SCHOOL: ${{ secrets.COURSEDOG_SCHOOL }}
        run: python build_org_events.py

      - name: Commit updated feed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/recreation-events.json docs/library-events.json
          git diff --staged --quiet || git commit -m "chore: refresh department event feeds [skip ci]"
          git push
