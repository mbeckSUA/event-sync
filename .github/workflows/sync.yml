name: Event Sync

on:
  schedule:
    - cron: '7 10 * * *'  # ~3am Pacific (10:07 UTC, PDT) — moved off 6am (Sept 22)
                            # since GitHub's scheduler was running these hours late
                            # some mornings. An overnight slot at an odd minute
                            # (not :00/:15/:30, when everyone else's cron fires)
                            # should queue faster. Cron is fixed in UTC and doesn't
                            # shift with DST — this drifts to ~2am Pacific once PST
                            # kicks in each winter, which is fine for "before anyone's up."
  workflow_dispatch:        # Manual trigger for testing

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests icalendar

      - name: Run athletics sync
        env:
          COURSEDOG_BASE: ${{ secrets.COURSEDOG_BASE }}
          COURSEDOG_EMAIL: ${{ secrets.COURSEDOG_EMAIL }}
          COURSEDOG_PASSWORD: ${{ secrets.COURSEDOG_PASSWORD }}
          COURSEDOG_SCHOOL: ${{ secrets.COURSEDOG_SCHOOL }}
          COURSEDOG_ORG_ID: ${{ secrets.COURSEDOG_ORG_ID }}
          COURSEDOG_SOCCER_ROOM_ID: ${{ secrets.COURSEDOG_SOCCER_ROOM_ID }}
          COURSEDOG_POOL_ROOM_ID: ${{ secrets.COURSEDOG_POOL_ROOM_ID }}
          COURSEDOG_TRACK_ROOM_ID: ${{ secrets.COURSEDOG_TRACK_ROOM_ID }}
          COURSEDOG_VOLLEYBALL_ROOM_ID: ${{ secrets.COURSEDOG_VOLLEYBALL_ROOM_ID }}
        run: python sync.py

      - name: Commit updated state files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "chore: update sync state [skip ci]"
          git push
