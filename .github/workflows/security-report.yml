# Runs alongside sync.py / pac_sync.py / build_campus_events.py — same repo,
# same secrets pattern. Publishes a static HTML page to docs/, same
# GitHub-Pages-via-commit-back pattern as campus-events.yml, rather than
# emailing — SUA's O365 tenant makes plain SMTP auth a headache (see project
# notes), and a pull-based dashboard also lets security check right now
# instead of waiting for tomorrow's run.
#
# ACCESS NOTE: the published URL has no login behind it, same as the
# campus-happenings pages — an unguessable folder name is the only access
# control. That's an accepted, deliberate trade-off for now (see project
# notes on the SharePoint/Graph API migration path), not an oversight.
#
# Cron is UTC. Runs at ~3am Pacific on an odd minute, matching sync.yml and
# campus-events.yml — both were moved off ~6am because GitHub's scheduler
# was running hours late at that busier time. Offset by a few minutes from
# those two so all three don't race on the same checkout/push window.

name: Daily security report

on:
  schedule:
    - cron: "37 10 * * *"   # ~3:37am Pacific (10:37 UTC, PDT)
  workflow_dispatch: {}       # manual "Run workflow" button for testing

permissions:
  contents: write

jobs:
  publish-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Build and publish security report
        env:
          # Dedicated read-only API user — same one build_campus_events.py
          # uses. This script only ever does GET requests; never point it
          # at a read-write credential. See api-user-setup.md.
          COURSEDOG_READONLY_BASE: ${{ secrets.COURSEDOG_READONLY_BASE }}
          COURSEDOG_READONLY_EMAIL: ${{ secrets.COURSEDOG_READONLY_EMAIL }}
          COURSEDOG_READONLY_PASSWORD: ${{ secrets.COURSEDOG_READONLY_PASSWORD }}
          COURSEDOG_SCHOOL: ${{ secrets.COURSEDOG_SCHOOL }}
        run: python security_report.py --live --publish docs/security-5WYoLq6oCy4rKeWr/index.html

      - name: Commit updated report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/security-5WYoLq6oCy4rKeWr/index.html
          git diff --staged --quiet || git commit -m "chore: refresh security report [skip ci]"
          git push
