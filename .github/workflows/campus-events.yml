name: Campus Events

on:
  schedule:
    - cron: '22 10 * * *'  # ~3am Pacific (10:22 UTC, PDT) — moved off 6:15am (Sept 22)
                            # for the same reason as sync.yml's move (see that file):
                            # GitHub's scheduler was running these hours late some
                            # mornings. Kept the ~15min offset from sync.yml's slot so
                            # the two workflows still don't race on the same checkout.
    # Hourly refresh, 7am-7pm Pacific (added Nov 18). Cron is UTC, so this is written
    # for PST (UTC-8): 15:00-03:00 UTC. When DST starts in March it shifts to
    # 8am-8pm Pacific; change to '17 14-23,0-2 * * *' if you want 7am-7pm to hold.
    # Off-round minute on purpose (GitHub queues :00 runs late).
    - cron: '17 15-23,0-3 * * *'
  workflow_dispatch:        # Manual trigger for testing

# Never run two refreshes at once (e.g. a manual run landing on a scheduled one).
concurrency:
  group: campus-events
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Pull events from Coursedog
        env:
          # Deliberately the dedicated read-only API user, not the
          # read-write one the athletics sync above uses — see
          # api-user-setup.md on why those aren't interchangeable.
          COURSEDOG_READONLY_BASE: ${{ secrets.COURSEDOG_READONLY_BASE }}
          COURSEDOG_READONLY_EMAIL: ${{ secrets.COURSEDOG_READONLY_EMAIL }}
          COURSEDOG_READONLY_PASSWORD: ${{ secrets.COURSEDOG_READONLY_PASSWORD }}
          COURSEDOG_SCHOOL: ${{ secrets.COURSEDOG_SCHOOL }}
        run: python build_campus_events.py

      - name: Commit updated events.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/events.json docs/meetings.json
          git diff --staged --quiet || git commit -m "chore: refresh campus events [skip ci]"
          git pull --rebase origin "$GITHUB_REF_NAME"  # sync.yml also commits to this repo
          git push
